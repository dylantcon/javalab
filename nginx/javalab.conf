# javalab.dconn.dev — static CheerpJ sandbox. TLS terminated upstream (Cloudflare
# Tunnel), so nginx is plain HTTP and routes by Host (matches the other dconn.dev
# sites). The tunnel ingress sends javalab.dconn.dev → http://localhost:80.
#
# CheerpJ executes fully client-side (WebAssembly in the visitor's browser) — no
# server-side JVM, no execution surface; nginx only hands out files.
#
# IMPORTANT: deliberately NO Cross-Origin-Opener-Policy / Cross-Origin-Embedder-
# Policy headers — verified unnecessary (Swing, threads, and SourceDataLine audio
# all work without cross-origin isolation; COEP would break the CheerpJ CDN).

server {
    listen 80;
    listen [::]:80;
    server_name javalab.dconn.dev;

    root /var/www/javalab.dconn.dev/public;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Trust proxy headers (real client IP from the tunnel).
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    access_log /var/log/nginx/javalab.dconn.dev.access.log;
    error_log  /var/log/nginx/javalab.dconn.dev.error.log;

    # CheerpJ fetches jars/wasm via HTTP Range — nginx honours Range by default.
    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket relay (pair + fetch) → local javalab-relay systemd service. TLS is
    # terminated by the Cloudflare Tunnel, which forwards the WS Upgrade here. A
    # plain HTTP request is answered by the relay with a health-check line.
    location /relay {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 1h;   # idle, turn-based connections live long
        proxy_send_timeout 1h;
    }

    # Correct content types for the runtime/app artifacts (global mime.types may
    # not map all of these); default_type applies when the extension is unmapped.
    location ~* \.wasm$ { default_type application/wasm;         add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.jar$  { default_type application/java-archive; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.mjs$  { default_type text/javascript; }

    # HTML stays fresh so launcher/app pages update on redeploy.
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
}
