<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running... - JavaLab</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #06141d; color: #d6f5ef;
               font-family: Menlo, Consolas, monospace;
               -webkit-font-smoothing: none; text-rendering: optimizeSpeed; }
  #wrap { height: 100%; display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #status { color: #37c7b6; font-size: .85rem; padding: 1rem; text-align: center; }
  /* a real-terminal look: black screen, phosphor-green text, blinking block caret */
  #console { flex: 0 0 130px; margin: 0; padding: 6px 8px; overflow: auto;
             border-top: 2px solid #000; background: #000; color: #2ee66a;
             font-family: "Consolas", "Courier New", monospace; font-size: 12px; line-height: 1.3;
             white-space: pre-wrap; word-break: break-word;
             text-shadow: none; -webkit-font-smoothing: none; text-rendering: optimizeSpeed; }
  #console::after { content: ""; display: inline-block; width: 7px; height: 13px; margin-left: 1px;
             background: #2ee66a; vertical-align: text-bottom;
             animation: caret 1.06s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  /* Console view: hide the graphical display and let the terminal fill the realm
     (the stage stops scaling and stretches this iframe 1:1, so text stays sharp). */
  body.console-mode #app { display: none; }
  body.console-mode #console { flex: 1 1 auto; border-top: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="app"><div id="status">Loading Java runtime...</div></div>
  <pre id="console" aria-label="Program output"></pre>   <!-- CheerpJ writes stdout/stderr here -->
</div>

<!-- A visitor's jar (uploaded OR built in the IDE) runs in its own realm here.
     Bytes come from IndexedDB (this origin, client-only) into CheerpJ's in-memory
     /str mount; they never touch the network. The runtime version comes from the
     query (?version=) - chosen per jar from its bytecode; only Java 8 has audio. -->
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
<script type="module">
import { getBytes } from "/idb.js";

const params = new URLSearchParams(location.search);
const key = params.get("key");
const version = parseInt(params.get("version") || "17", 10);
const w = parseInt(params.get("w") || "1280", 10);   // the CheerpJ display (Java "screen") size;
const h = parseInt(params.get("h") || "800", 10);    // the console pane sits BELOW it (see #console)
const app = document.getElementById("app");
const sanitize = (n) => n.replace(/[^A-Za-z0-9._-]/g, "_");

// The stage chrome toggles between the graphical display and a full-height
// console (for stdout/stderr-centric programs) by posting a view-mode message.
window.addEventListener("message", (e) => {
  const m = e.data;
  if (m && m.source === "javalab-stage" && m.type === "view-mode")
    document.body.classList.toggle("console-mode", m.mode === "console");
});

(async () => {
  try {
    if (!key) throw new Error("no jar key");
    const bytes = await getBytes(key);
    if (!bytes) throw new Error("not in storage: " + key);
    await cheerpjInit({ version, status: "none" });
    const vfsPath = "/str/" + sanitize(key);
    cheerpOSAddStringFile(vfsPath, new Uint8Array(bytes));
    app.innerHTML = "";
    cheerpjCreateDisplay(w, h, app);   // w×h IS the Java display; #console sits below it in the flex column
    await cheerpjRunJar(vfsPath);
  } catch (e) {
    app.innerHTML = '<div id="status">Failed to run: ' + e + "</div>";
  }
})();
</script>
</body>
</html>
